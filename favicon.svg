<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>
    <linearGradient id="disp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b9b9b"/>
      <stop offset="100%" stop-color="#585858"/>
    </linearGradient>
    <clipPath id="bg-clip">
      <rect width="100" height="100" rx="22" ry="22"/>
    </clipPath>
    <clipPath id="body-clip">
      <rect x="13" y="10" width="74" height="80" rx="7" ry="7"/>
    </clipPath>
    <clipPath id="disp-clip">
      <rect x="19" y="15" width="62" height="20" rx="3" ry="3"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>

  <!-- Calculator body -->
  <rect x="13" y="10" width="74" height="80" rx="7" ry="7" fill="#2c2c2c"/>

  <!-- Display -->
  <rect x="19" y="15" width="62" height="20" rx="3" ry="3" fill="url(#disp)"/>

  <!-- Buttons: cols 31, 50, 69 | rows 47, 62, 76 | r=7.5 -->
  <!-- Row 1 -->
  <circle cx="31" cy="47" r="7.5" fill="#c8c8c8"/>
  <circle cx="50" cy="47" r="7.5" fill="#c8c8c8"/>
  <circle cx="69" cy="47" r="7.5" fill="#f0a000"/>

  <!-- Row 2 -->
  <circle cx="31" cy="62" r="7.5" fill="#c8c8c8"/>
  <circle cx="50" cy="62" r="7.5" fill="#c8c8c8"/>
  <circle cx="69" cy="62" r="7.5" fill="#f0a000"/>

  <!-- Row 3 -->
  <circle cx="31" cy="76" r="7.5" fill="#c8c8c8"/>
  <circle cx="50" cy="76" r="7.5" fill="#c8c8c8"/>
  <circle cx="69" cy="76" r="7.5" fill="#f0a000"/>
</svg>
