<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Whale's Card — Print</title>
  <style>
    /* Single fold card — prints on one sheet of Letter paper.
       Fold in half: left meets right.
       Left half = inside (QR code). Right half = front cover. */

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #eee;
      font-family: Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      gap: 1rem;
    }

    .no-print {
      background: white;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      max-width: 700px;
      width: 100%;
      font-size: 0.85rem;
      color: #444;
      line-height: 1.6;
      font-family: system-ui, sans-serif;
    }

    .no-print h2 { margin-bottom: 0.4rem; font-size: 1rem; }

    button {
      margin-top: 0.6rem;
      padding: 0.5rem 1.2rem;
      background: #1a3a5a;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* ── CARD SHEET ───────────────────────────────────────
       Full letter width, half letter height.
       Left panel = inside. Right panel = front (prints
       upside-down so it faces out when folded right→left).
    ──────────────────────────────────────────────────── */

    .card-sheet {
      width: 6in;
      height: 3in;
      background: white;
      display: flex;
      position: relative;
      border: 1px solid #ddd;
    }

    /* Fold guide — hidden on print */
    .fold-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: #ccc;
      pointer-events: none;
    }

    /* ── PANELS ───────────────────────────────────────── */

    .panel {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.25in;
      position: relative;
    }

    .front-whale {
      width: 1.4in;
      height: auto;
      margin-bottom: 0.15in;
      opacity: 0.88;
    }

    .front-rule {
      width: 0.8in;
      height: 1px;
      background: #bbb;
      margin-bottom: 0.12in;
    }

    .front-line {
      font-size: 10pt;
      color: #1a1a1a;
      text-align: center;
      font-style: italic;
      line-height: 1.4;
      max-width: 1.8in;
    }

    .inside-label {
      font-size: 7pt;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 0.15in;
      font-family: system-ui, sans-serif;
    }

    .qr-img {
      width: 1.2in;
      height: 1.2in;
      object-fit: contain;
    }

    .scan-text {
      margin-top: 0.12in;
      font-size: 7pt;
      color: #777;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    /* ── INSIDE (left) — QR code ──────────────────────── */

    .panel-front {
      border-right: 1px dashed #ccc;
    }

    .panel-inside {
      /* right panel — no special treatment */
    }

    .inside-label {
      font-size: 9pt;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 0.3in;
      font-family: system-ui, sans-serif;
    }

    .qr-img {
      width: 1.8in;
      height: 1.8in;
      object-fit: contain;
    }

    .scan-text {
      margin-top: 0.25in;
      font-size: 9pt;
      color: #777;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: system-ui, sans-serif;
    }

    .panel-front {
      /* no rotation — fold left panel over right */
    }

    .front-whale {
      width: 2.2in;
      height: auto;
      margin-bottom: 0.25in;
      opacity: 0.88;
    }

    .front-rule {
      width: 1.2in;
      height: 1px;
      background: #bbb;
      margin-bottom: 0.2in;
    }

    .front-line {
      font-size: 13pt;
      color: #1a1a1a;
      text-align: center;
      font-style: italic;
      line-height: 1.5;
      max-width: 2.8in;
    }

    /* ── PRINT ────────────────────────────────────────── */

    @media print {
      body { background: none; padding: 0; margin: 0; }
      .no-print { display: none; }
      .fold-line { display: none; }
      .card-sheet {
        width: 8.5in;
        height: 5.5in;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <h2>🐋 Print Instructions</h2>
    Print on Letter paper — the card is index-card sized (6×3in), uses a tiny corner of the page. Cut along the border, fold in half left over right.
    <br><button onclick="window.print()">🖨 Print Card</button>
  </div>

  <div class="card-sheet">
    <div class="fold-line"></div>

    <!-- Front cover — left panel, no rotation needed, fold left over right -->
    <div class="panel panel-front">
      <img class="front-whale"
           src="assets/whale/whale_nuetral.png"
           alt="The whale"
           onerror="this.outerHTML='<div style=\'font-size:60pt\'>🐋</div>'" />
      <div class="front-rule"></div>
      <p class="front-line">"I've been searching for someone trustworthy."</p>
    </div>

    <!-- Inside — QR code (right panel) -->
    <div class="panel panel-inside">
      <div class="inside-label">Scan to begin</div>
      <img class="qr-img" src="assets/qr.png" alt="QR Code" />
      <div class="scan-text">The ocean has a message for you.</div>
    </div>

  </div>

</body>
</html>
