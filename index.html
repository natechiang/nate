<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Encryptor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #f8f8f8;
      color: #222;
      font-family: sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 20px #0002;
    }
    h1, h2 { font-size: 1.3em; margin-bottom: 1em; }
    label { display: block; margin-top: 1em; font-weight: bold; }
    select, input[type="password"], input[type="text"], textarea {
      width: 100%;
      margin-top: 0.5em;
      margin-bottom: 1em;
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 1em;
      background: #fff;
      box-sizing: border-box;
    }
    textarea { height: 90px; resize: vertical; }
    input[type="checkbox"] { width: auto; }
    button {
      margin-right: 1em;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 19px;
      font-size: 1em;
      cursor: pointer;
      margin-bottom: 1em;
      margin-top: 0.5em;
      transition: background 0.2s;
    }
    button:hover { background: #1741b6; }
    .section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 1px 4px #0001;
    }
    .hidden { display: none !important; }
    .logout {
      background: #e11d48;
      margin-left: 0 !important;
    }
    .note {
      font-size: 0.97em;
      color: #666;
      background: #f1f5f9;
      border-left: 4px solid #2563eb;
      padding: 10px 16px;
      border-radius: 7px;
      margin-bottom: 1.2em;
    }
    #who span.Guest { color: #65a30d; }
    #who span.Nate { color: #2563eb; }
    #who span.Ethan { color: #e11d48; }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div class="section" id="loginScreen">
    <h1>🔒 Login to Encryptor</h1>
    <label for="account">Account:</label>
    <select id="account" autocomplete="off">
      <option value="Ethan">Ethan</option>
      <option value="Nate">Nate</option>
      <option value="Guest">Guest</option>
    </select>
    <label id="logLabel" for="loginPassword">Password:</label>
    <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="off">
    <div id="confirmRow" class="hidden">
      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="off">
    </div>
    <button onclick="handleLogin()" id="loginBtn">Login</button>
    <div id="loginMsg" style="color:#e11d48; font-size:1em; margin-top:.5em;"></div>
  </div>

  <!-- Encryptor Main Screen -->
  <div class="section hidden" id="mainScreen">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 id="who"></h2>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
    <div class="note">
      ⚠️ Your encryption password and all encrypted text are stored only in your browser (<code>localStorage</code>). If you forget your password or clear browser data, recovery is not possible. This tool provides only local, browser-based security.
    </div>
    <label for="pw">Encryption Password
      <span id="pwShareMsg" style="font-weight:normal;font-size:0.93em;color:#666"></span>
    </label>
    <input type="password" id="pw" autocomplete="off" placeholder="Enter encryption password">
    <label><input type="checkbox" id="showPw" onchange="togglePw()"> Show Encryption Password</label>
    <div style="margin-bottom:0.6em"></div>
    <button onclick="savePw()" style="margin:0 0 1em 0;">Save Encryption Password</button>
    <button onclick="exportPw()" style="background:#059669;margin:0 0 1em 0;">Export</button>
    <input type="file" id="importPwFile" style="display:none" accept=".txt">
    <button onclick="document.getElementById('importPwFile').click()" style="background:#f59e42;margin:0 0 1em 0;">Import</button>

    <label for="plain">Plaintext message:</label>
    <textarea id="plain" placeholder="Text to encrypt"></textarea>

    <button onclick="encrypt()">Encrypt ▶</button>
    <button onclick="decrypt()">◀ Decrypt</button>

    <label for="cipher">Ciphertext (base64):</label>
    <textarea id="cipher" placeholder="Encrypted output"></textarea>
    <div id="actionMsg" style="color:#e11d48; font-size:1em;margin-top:0.5em"></div>
  </div>

  <script>
    // --- LOGIN LOGIC ---
    const loginScreen = document.getElementById('loginScreen');
    const mainScreen = document.getElementById('mainScreen');
    const who = document.getElementById('who');
    const accountSel = document.getElementById('account');
    const loginPassword = document.getElementById('loginPassword');
    const confirmRow = document.getElementById('confirmRow');
    const confirmPassword = document.getElementById('confirmPassword');
    const loginMsg = document.getElementById('loginMsg');
    const actionMsg = document.getElementById('actionMsg');
    let currentUser = "";

    // UI update
    accountSel.onchange = loginPassword.oninput = function() { checkAccountStatus(); }

    function mainHashKey(user) {
      // For Nate/Ethan, share a single hash key; Guest separate
      return (user==="Guest") ? "encryptor_login_password_Guest"
        : "encryptor_login_password_MAIN";
    }

    function encryptionPwKey(user) {
      // For Nate/Ethan, share a single encryption password key; Guest separate
      return (user==="Guest") ? "encryptor_encryption_password_Guest"
        : "encryptor_encryption_password_MAIN";
    }

    function checkAccountStatus() {
      loginMsg.textContent = "";
      let user = accountSel.value;
      let hashKey = mainHashKey(user);
      let key = localStorage.getItem(hashKey);
      if (!key) {
        // Not set up yet; prompt for setting new
        confirmRow.classList.remove("hidden");
        document.getElementById('loginBtn').textContent = "Set Password";
      } else {
        // Exists; hide confirm
        confirmRow.classList.add("hidden");
        document.getElementById('loginBtn').textContent = "Login";
      }
    }

    async function handleLogin() {
      let user = accountSel.value;
      let hashKey = mainHashKey(user);
      let stored = localStorage.getItem(hashKey);
      let pass = loginPassword.value;
      // CASE 1: Not set yet (initial setup)
      if (!stored) {
        let confirm = confirmPassword.value;
        if (!pass || !confirm) {
          loginMsg.textContent = "Please enter and confirm a password.";
          return;
        }
        if (pass !== confirm) {
          loginMsg.textContent = "Passwords do not match!";
          return;
        }
        // Store SHA-256 hash of password in the shared or separate key
        let hashHex = await digestHex(pass);
        localStorage.setItem(hashKey, hashHex);
        if(user !== "Guest") {
          localStorage.setItem(mainHashKey("Ethan"), hashHex);
          localStorage.setItem(mainHashKey("Nate"), hashHex);
        }
        loginPassword.value = "";
        confirmPassword.value = "";
        loginMsg.textContent = "Password set! Please login.";
        checkAccountStatus();
        return;
      }
      // CASE 2: Password check
      if (!pass) {
        loginMsg.textContent = "Please enter your password.";
        return;
      }
      let enteredHash = await digestHex(pass);
      if (enteredHash !== stored) {
        loginMsg.textContent = "Incorrect password.";
        return;
      }
      // Success!
      loginPassword.value = "";
      loginMsg.textContent = "";
      currentUser = user;
      loginScreen.classList.add("hidden");
      mainScreen.classList.remove("hidden");
      showAccountCue();
      loadEncryptionPassword();
      showPwShareMsg();
      clearActionMsg();
      clearTextFields();
    }

    function logout() {
      currentUser = "";
      mainScreen.classList.add("hidden");
      loginScreen.classList.remove("hidden");
      loginPassword.value = "";
      confirmPassword.value = "";
      loginMsg.textContent = "";
      clearTextFields();
      clearActionMsg();
    }

    function clearTextFields() {
      document.getElementById('pw').value = "";
      document.getElementById('plain').value = "";
      document.getElementById('cipher').value = "";
    }

    function clearActionMsg() {
      actionMsg.textContent = "";
    }

    // Helper: SHA256 Hex
    async function digestHex(str) {
      const enc = new TextEncoder().encode(str);
      const buf = await crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2,"0")).join('');
    }

    // --- ENCRYPTION PASSWORD SHARING ---
    function savePw() {
      if(!currentUser) return;
      const pw = document.getElementById('pw').value;
      let k = encryptionPwKey(currentUser);
      if (!pw) {
        actionMsg.textContent = "Enter an encryption password to save.";
        return;
      }
      if(currentUser === "Guest") {
        localStorage.setItem(k, pw);
      } else {
        localStorage.setItem(encryptionPwKey("Nate"), pw);
        localStorage.setItem(encryptionPwKey("Ethan"), pw);
      }
      showPwShareMsg();
      actionMsg.textContent = "Encryption password saved.";
      setTimeout(() => { actionMsg.textContent = ""; }, 1300);
    }
    // Auto-save on field blur for convenience
    document.getElementById('pw').addEventListener('blur', savePw);

    function loadEncryptionPassword() {
      if(!currentUser) return;
      let val = localStorage.getItem(encryptionPwKey(currentUser)) || "";
      document.getElementById('pw').value = val;
    }

    function showPwShareMsg() {
      const msg = document.getElementById('pwShareMsg');
      if(currentUser === "Nate" || currentUser === "Ethan") {
        msg.textContent = " (Shared: Changing this updates for both)";
      } else {
        msg.textContent = "";
      }
    }

    // Export encryption password
    function exportPw() {
      if (!currentUser) return;
      let pw = document.getElementById('pw').value;
      if (!pw) {
        actionMsg.textContent = "There is no encryption password to export.";
        return;
      }
      // Export as a base64 string
      const blob = new Blob([btoa(unescape(encodeURIComponent(pw)))], {type: "text/plain"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const fileBase = (currentUser === "Guest") ? "guest" : "main";
      a.download = "encryption_password_" + fileBase + ".txt";
      a.click();
      setTimeout(()=>URL.revokeObjectURL(url),3000);
      actionMsg.textContent = "Encryption password exported.";
      setTimeout(() => { actionMsg.textContent = ""; }, 1300);
    }

    // Import encryption password
    document.getElementById('importPwFile').addEventListener('change', function(e){
      if (!e.target.files.length) return;
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = function(evt) {
        let val = "";
        try {
          val = decodeURIComponent(escape(atob(evt.target.result)));
        } catch {
          actionMsg.textContent = "Import failed: Invalid file contents.";
          return;
        }
        document.getElementById('pw').value = val;
        savePw();
        actionMsg.textContent = "Imported and saved encryption password.";
        setTimeout(() => { actionMsg.textContent = ""; }, 1500);
      };
      reader.readAsText(file);
    });

    // Visual account cue:
    function showAccountCue() {
      const accountEmojis = {"Nate":"🟩","Ethan":"🟦","Guest":"🟥"};
      let user = currentUser;
      who.innerHTML = accountEmojis[user] + ' ' +
        'Logged in as: <span class="' + user + '">' + user + "</span>";
    }

    // Show/hide password functionality
    function togglePw() {
      const pwInput = document.getElementById('pw');
      const cb = document.getElementById('showPw');
      pwInput.type = cb.checked ? 'text' : 'password';
    }

    // --- ENCRYPTION CODE ---
    const ITER = 100000, SALT = 16, IV = 12;
    const pwEl = document.getElementById('pw');
    const plainEl = document.getElementById('plain');
    const cipherEl = document.getElementById('cipher');

    const b64 = arr => btoa(String.fromCharCode(...arr));
    const unb64 = str => new Uint8Array(atob(str).split('').map(c => c.charCodeAt(0)));

    async function derive(pw, salt) {
      const baseKey = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt","decrypt"]
      );
    }

    async function encrypt() {
      clearActionMsg();
      const pw = pwEl.value, pt = plainEl.value;
      if (!pw || !pt) {
        actionMsg.textContent = "Please provide both the encryption password and a message to encrypt.";
        return;
      }
      try {
        const salt = crypto.getRandomValues(new Uint8Array(SALT));
        const iv = crypto.getRandomValues(new Uint8Array(IV));
        const key = await derive(pw, salt);
        const ct = await crypto.subtle.encrypt(
          { name: "AES-GCM", iv }, key, new TextEncoder().encode(pt)
        );
        const all = new Uint8Array([...salt, ...iv, ...new Uint8Array(ct)]);
        cipherEl.value = b64(all);
        actionMsg.textContent = "Encryption successful.";
        setTimeout(clearActionMsg, 1200);
      } catch (err) {
        actionMsg.textContent = "Encryption failed: " + err;
      }
    }

    async function decrypt() {
      clearActionMsg();
      const pw = pwEl.value, ctStr = cipherEl.value;
      if (!pw || !ctStr) {
        actionMsg.textContent = "Please provide both the encryption password and ciphertext to decrypt.";
        return;
      }
      try {
        const all = unb64(ctStr);
        const salt = all.slice(0, SALT), iv = all.slice(SALT, SALT+IV), ct = all.slice(SALT+IV);
        const key = await derive(pw, salt);
        const ptBuf = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv }, key, ct
        );
        plainEl.value = new TextDecoder().decode(ptBuf);
        actionMsg.textContent = "Decryption successful.";
        setTimeout(clearActionMsg, 1200);
      } catch {
        actionMsg.textContent = "Decryption failed (wrong password or invalid/corrupt data).";
      }
    }
  </script>
</body>
</html>
